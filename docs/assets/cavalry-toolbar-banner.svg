<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Cavalry Toolbar — native radial script launcher</title>
  <desc id="desc">A dark grid banner with the Cavalry Toolbar wordmark and a twelve-slot radial script wheel in Cavalry green.</desc>
  <defs>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2fcd71"/>
      <stop offset="1" stop-color="#078430"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="1">
      <stop offset="0" stop-color="#2fcd71" stop-opacity=".16"/>
      <stop offset="1" stop-color="#078430" stop-opacity=".02"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d9e7ff" stroke-opacity=".055"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="24" fill="#131a24"/>
  <rect x="1" y="1" width="1198" height="298" rx="23" fill="url(#grid)" stroke="#2a394b"/>
  <rect x="1" y="1" width="720" height="298" rx="23" fill="url(#glow)"/>
  <circle cx="970" cy="132" r="112" fill="#2fcd71" fill-opacity=".08" filter="url(#soft)"/>
  <rect x="58" y="52" width="8" height="196" rx="4" fill="url(#accent)"/>
  <text x="96" y="126" fill="#f4f8ff" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="43" font-weight="700" letter-spacing="3">CAVALRY TOOLBAR</text>
  <text x="100" y="164" fill="#aabbd2" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="15" letter-spacing="1.5">NATIVE CAVALRY SCRIPT LAUNCHER</text>
  <text x="100" y="214" fill="#2fcd71" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="13">12 SLOTS  /  PROFILES  /  LOCAL EXECUTION</text>
